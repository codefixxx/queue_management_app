<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Primary Metadata -->
    <title>QueueFlow — Smart Real-Time Queue & Token Management</title>
    <meta name="title" content="QueueFlow — Smart Real-Time Queue & Token Management" />
    <meta
      name="description"
      content="High-performance real-time queue management system featuring live ticket dispatch, priority reordering, automated counter calling, wait-time telemetry, and public kiosk displays."
    />
    <meta name="keywords" content="queue management, token system, wait time tracker, ticket dispatch, queue analytics, customer flow, public kiosk display" />
    <meta name="author" content="QueueFlow" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://queuemanagementapp-client.vercel.app/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://queuemanagementapp-client.vercel.app/" />
    <meta property="og:site_name" content="QueueFlow" />
    <meta property="og:title" content="QueueFlow — Smart Real-Time Queue & Token Management" />
    <meta
      property="og:description"
      content="High-performance real-time queue management system featuring live ticket dispatch, priority reordering, automated counter calling, wait-time telemetry, and public kiosk displays."
    />
    <meta property="og:image" content="https://queuemanagementapp-client.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QueueFlow Dispatch Terminal and Analytics Preview" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://queuemanagementapp-client.vercel.app/" />
    <meta name="twitter:title" content="QueueFlow — Smart Real-Time Queue & Token Management" />
    <meta
      name="twitter:description"
      content="Real-time queue dispatch terminal, customer token management, operational telemetry, and public waiting kiosk."
    />
    <meta name="twitter:image" content="https://queuemanagementapp-client.vercel.app/og-image.jpg" />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#10b981" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090d0b" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#10b981" />

    <!-- Custom Google Fonts: Inter, Merriweather, Geist Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <script>
      // Initialize theme early to avoid flash of wrong theme
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-background text-foreground min-h-screen selection:bg-primary/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
